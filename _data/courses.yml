- id: surrogate-models
  title: "Surrogate Models for Process Decision-Making"
  title_ko: "공정 의사결정을 위한 서로게이트 모델"
  subtitle: "From process prediction to optimization-compatible AI"
  subtitle_ko: "공정 예측에서 최적화에 활용할 수 있는 AI까지"
  description: "An eight-week course on vector and sequence surrogates, physics-informed learning, exact ReLU MILP embedding, and conditional ICNN/PICNN LP reformulation."
  description_ko: "변수 벡터·시계열 surrogate, physics-informed learning, ReLU 모델의 exact MILP embedding, ICNN/PICNN의 조건부 LP reformulation을 연결하는 8주 과정입니다."
  url: /courses/surrogate-models/
  syllabus_url: /courses/surrogate-models/syllabus/
  level: "Graduate entry"
  level_ko: "화학공학 대학원 입문"
  duration: "8 weeks"
  duration_ko: "8주"
  weeks:
    - number: 1
      title: "From process prediction to decisions"
      title_ko: "공정 예측에서 의사결정으로"
      topics: "Variables, units, operating domains, data splits, optimization, and simulator revalidation."
      topics_ko: "변수·단위·운전 영역, 데이터 분할, 최적화 문제, 공정 모델 재검증."
      deliverable: "A CSTR problem specification and a reproducible prediction-to-decision baseline."
      deliverable_ko: "CSTR 문제 정의와 재현 가능한 예측–의사결정 baseline."
      reading: "Boyd & Vandenberghe, Chapters 2–4 (selected sections); OMLT introduction."
      reading_ko: "Boyd & Vandenberghe 2–4장 중 지정 내용; OMLT 서론."
      url: /courses/surrogate-models/week-01/
    - number: 2
      title: "Steady-state vector-to-vector surrogates"
      title_ko: "정상상태 vector-to-vector surrogate"
      topics: "Multi-output MLPs, scaling, sampling, output errors, and balance residuals."
      topics_ko: "다출력 MLP, scaling, sampling, 출력별 오차와 수지 residual."
      deliverable: "A trained multi-output MLP with a documented domain and held-out evaluation."
      deliverable_ko: "운전 영역과 독립 평가 결과를 명시한 다출력 MLP."
      reading: "KKT-hPINN, Sections 1–3 (MLP and process-surrogate setup)."
      reading_ko: "KKT-hPINN 1–3절 중 MLP와 공정 surrogate 문제 설정."
    - number: 3
      title: "Dynamic sequence-to-sequence surrogates"
      title_ko: "동적 sequence-to-sequence surrogate"
      topics: "Window MLPs, state transitions, RNN/LSTM, direct prediction, rollout, and trajectory splits."
      topics_ko: "Window MLP, 상태전이, RNN/LSTM, direct prediction, rollout, 궤적 단위 분할."
      deliverable: "One-step and multi-step predictions conditioned on a candidate future input sequence."
      deliverable_ko: "미래 조작변수 계획을 입력으로 받는 one-step·multi-step 예측."
      reading: "Sutskever et al., Sections 1–2; DeepONet introduction (optional)."
      reading_ko: "Sutskever et al. 1–2절; DeepONet 서론(선택)."
    - number: 4
      title: "Physics-informed learning and KKT-hPINN"
      title_ko: "Physics-informed learning과 KKT-hPINN"
      topics: "Residual losses, automatic differentiation, linear equality projection, KKT derivation, and rank conditions."
      topics_ko: "Residual loss, 자동미분, 선형 등식 projection, KKT 유도와 rank 조건."
      deliverable: "An MLP/PINN/KKT-hPINN comparison that separates accuracy from constraint satisfaction."
      deliverable_ko: "예측 정확도와 제약 만족을 각각 평가하는 MLP/PINN/KKT-hPINN 비교."
      reading: "Raissi et al., PINN formulation; Chen et al., Section 3 and selected case studies."
      reading_ko: "Raissi et al.의 PINN formulation; Chen et al. 3절과 선정 공정 사례."
    - number: 5
      title: "Exact MILP embedding of ReLU networks"
      title_ko: "ReLU 신경망의 exact MILP embedding"
      topics: "Network graphs, binary variables, Big-M derivation, valid activation bounds, and scaling."
      topics_ko: "신경망 graph, binary variable, Big-M 유도, 유효한 activation bounds와 scaling."
      deliverable: "A hand-built embedding whose outputs match the frozen network at fixed inputs."
      deliverable_ko: "고정 입력에서 학습된 신경망과 출력이 일치하는 직접 작성한 embedding."
      reading: "Anderson et al., formulation preliminaries and ReLU formulations."
      reading_ko: "Anderson et al.의 formulation 기초와 ReLU formulation."
    - number: 6
      title: "Embedding in practice: bounds, OMLT, and horizons"
      title_ko: "Embedding 실무: bounds, OMLT, horizon"
      topics: "Bound tightening, LP relaxations, MIP gaps, OMLT, affine projection layers, and finite-horizon ReLU models."
      topics_ko: "Bound tightening, LP relaxation, MIP gap, OMLT, affine projection layer와 유한 horizon ReLU 모델."
      deliverable: "A formulation and solve-time comparison with forward-pass revalidation."
      deliverable_ko: "Forward 재검증을 포함한 formulation·풀이 시간 비교."
      reading: "OMLT paper and documentation; Anderson et al., stronger formulations (selected)."
      reading_ko: "OMLT 논문·문서; Anderson et al.의 강한 formulation 중 지정 내용."
    - number: 7
      title: "ICNN/PICNN and conditional LP reformulation"
      title_ko: "ICNN/PICNN과 조건부 LP reformulation"
      topics: "Convexity conditions, epigraphs, fixed context, constraint direction, and equality counterexamples."
      topics_ko: "Convexity 조건, epigraph, 고정 context, 제약 방향과 등식 반례."
      deliverable: "An LP on a verified convex example and an explicit list of equivalence conditions."
      deliverable_ko: "Convexity가 확인된 예제의 LP와 동치 조건 목록."
      reading: "Amos et al., Section 3 and Supplement B."
      reading_ko: "Amos et al. 3절과 Supplement B."
    - number: 8
      title: "A complete process decision workflow"
      title_ko: "공정 의사결정 전체 workflow"
      topics: "Decision-point errors, extrapolation, feasibility, economic performance, simulator rechecks, and targeted data collection."
      topics_ko: "의사결정 지점 오차, extrapolation, feasibility, 경제성, 공정 모델 재검증과 데이터 추가."
      deliverable: "A reproducible report covering model error, decision quality, violations, and computation time."
      deliverable_ko: "모델 오차·의사결정 품질·제약 위반·계산 시간을 보고하는 재현 가능한 결과물."
      reading: "Revisit the assumptions and validation results from Weeks 1–7."
      reading_ko: "1–7주차의 가정과 검증 결과 재검토."

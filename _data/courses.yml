- id: "surrogate-models"
  title: "Surrogate Modeling for Process Prediction and Optimal Decision-Making"
  title_ko: "공정 예측과 최적 의사결정을 위한 서로게이트 모델링"
  subtitle: "From process prediction to optimization and operating decisions"
  subtitle_ko: "공정 예측에서 최적화와 운전 의사결정으로"
  description: "An eight-week course progressing from validated process predictors to physical consistency, optimization formulations, model structure, and revalidated operating decisions."
  description_ko: "공정 예측 모델의 학습·검증에서 물리적 일관성, 최적화 정식화와 모델 구조 설계를 거쳐 운전 의사결정과 재검증으로 이어지는 8주 과정입니다."
  url: "/courses/surrogate-models/"
  syllabus_url: "/courses/surrogate-models/syllabus/"
  level: "Graduate entry"
  level_ko: "화학공학 대학원 입문"
  duration: "8 weeks"
  duration_ko: "8주"
  availability: "Syllabus and Weeks 1–6 available"
  availability_ko: "강의계획서와 1–6주차 공개"
  weeks:
    - number: 1
      title: "Process Prediction and Surrogate Modeling Basics"
      title_ko: "공정 예측과 surrogate 모델의 기초"
      topics: "Inputs, outputs, fixed context, units, operating domain, reference data, a regression baseline, and independent prediction checks."
      topics_ko: "입력·출력·고정 context·단위·운전 영역, 기준 데이터, 회귀 baseline과 독립 예측 평가."
      deliverable: "A steady-state CSTR data contract, fitted regression baseline, and held-out prediction report."
      deliverable_ko: "정상상태 CSTR 예측 문제 정의, 회귀 baseline과 독립 test 평가 보고서."
      url: /courses/surrogate-models/week-01/
    - number: 2
      title: "Learning Multicomponent Steady-State Responses with MLPs"
      title_ko: "MLP로 다성분 정상상태 응답 학습하기"
      topics: "Three-component balances, scaling, MLP forward/backpropagation, training, component errors, and concentration consistency."
      topics_ko: "세 성분 수지, scaling, MLP forward·backpropagation, 학습, 성분별 오차와 농도 합 일관성."
      deliverable: "A steady-state MLP evaluated in physical units, with a hand-checked gradient update."
      deliverable_ko: "물리 단위로 평가한 정상상태 MLP와 손 계산으로 확인한 gradient 갱신."
      url: /courses/surrogate-models/week-02/
    - number: 3
      title: "Predicting Dynamic Responses and Rollout"
      title_ko: "동적 응답 예측과 rollout"
      topics: "State-transition MLPs, initial states, future operating inputs, one-step prediction, and full-trajectory rollout. RNN/LSTM and encoder–decoder extensions are optional."
      topics_ko: "상태전이 MLP, 초기 상태, 미래 운전 입력, one-step 예측과 전체 궤적 rollout. RNN/LSTM·encoder–decoder는 선택 확장."
      deliverable: "A comparison of one-step and trajectory errors under prescribed future inputs."
      deliverable_ko: "정해진 미래 입력에 대한 one-step·전체 궤적 오차 비교."
      url: /courses/surrogate-models/week-03/
    - number: 4
      title: "Learning with Physical Constraints"
      title_ko: "물리 제약을 반영한 학습"
      topics: "Residual losses, automatic differentiation, hard linear-equality projection, KKT derivation, rank assumptions, and remaining violations."
      topics_ko: "Residual loss, 자동미분, hard 선형 등식 projection, KKT 유도, rank 가정과 남은 제약 위반."
      deliverable: "An MLP/soft-physics/hard-equality comparison separating accuracy from physical consistency."
      deliverable_ko: "정확도와 물리적 일관성을 구분한 MLP·soft physics·hard 등식 모델 비교."
      url: /courses/surrogate-models/week-04/
    - number: 5
      title: "From a Predictor to an Optimization Formulation"
      title_ko: "예측 모델을 최적화 문제에 넣기"
      topics: "Operating variables versus fixed context, objectives and constraints, frozen ReLU graphs, binary variables, Big-M, valid bounds, and scaling."
      topics_ko: "조작변수와 고정 context, 목적함수·제약, 고정된 ReLU graph, binary variable, Big-M, 유효한 bounds와 scaling."
      deliverable: "A hand-built MILP representation checked against the frozen network forward pass."
      deliverable_ko: "고정 신경망의 forward 출력과 대조한 직접 작성한 MILP 표현."
      url: /courses/surrogate-models/week-05/
    - number: 6
      title: "Solve Time and Results in Neural-Network Optimization"
      title_ko: "신경망 기반 최적화의 풀이 속도와 결과 해석"
      topics: "Bound tightening, scaling, OMLT, LP relaxations, HiGHS termination, gaps, computation time, and reference-process checks."
      topics_ko: "Bound tightening, scaling, OMLT, LP 완화, HiGHS 종료 상태, gap, 계산 시간과 기준 공정 검사."
      deliverable: "A comparison of formulations for the same frozen network, reporting bounds, binary counts, termination, gaps, timing, and forward checks."
      deliverable_ko: "같은 고정 신경망의 정식화를 비교하고 bounds·이진변수 수·종료 상태·gap·계산 시간·forward 검사 결과를 정리한 보고서."
      url: /courses/surrogate-models/week-06/
    - number: 7
      title: "Designing Model Structure for Optimization"
      title_ko: "최적화 활용을 위한 모델 구조 설계"
      topics: "ICNN/PICNN, convexity conditions, ReLU/linear epigraphs, fixed context, inequality direction, and equivalence counterexamples."
      topics_ko: "ICNN/PICNN, convexity 조건, ReLU/linear epigraph, 고정 context, 부등식 방향과 동치성 반례."
      deliverable: "An ICNN and valid LP on a known convex example, with explicit applicability conditions."
      deliverable_ko: "알려진 convex 예제의 ICNN·유효한 LP와 적용 조건 목록."
    - number: 8
      title: "Selecting and Revalidating Operating Conditions"
      title_ko: "운전 조건 선택과 공정 모델 재검증"
      topics: "Decision-point errors, extrapolation, physical feasibility, economic performance, reference-model checks, and targeted additional data."
      topics_ko: "선택 지점의 오차, extrapolation, 물리적 feasibility, 경제성, 기준 공정 모델 재검증과 데이터 보완."
      deliverable: "A reproducible prediction-to-optimization report separating errors, violations, decision quality, and computation."
      deliverable_ko: "오차·제약 위반·의사결정 품질·계산 부담을 구분한 재현 가능한 예측–최적화 보고서."

- id: "practical-algorithms"
  title: "Practical Data Structures and Algorithms"
  title_ko: "실무 자료구조와 알고리즘"
  subtitle: "Eight weeks of Python and selected LeetCode problems"
  subtitle_ko: "Python과 LeetCode 문제로 배우는 8주 과정"
  description: "Learn common data structures and algorithm patterns through selected LeetCode problems. Write Python solutions, trace their behavior, and check correctness and computational cost."
  description_ko: "LeetCode 문제를 풀며 자주 사용하는 자료구조와 알고리즘 패턴을 배웁니다. Python 풀이를 직접 작성하고 실행 과정을 따라가며 정확성과 계산 비용을 확인합니다."
  url: "/courses/practical-algorithms/"
  syllabus_url: "/courses/practical-algorithms/syllabus/"
  level: "Introductory · no CS background required"
  level_ko: "입문 · 컴퓨터공학 비전공자 대상"
  duration: "8 weeks"
  duration_ko: "8주"
  availability: "Syllabus and Week 1 available"
  availability_ko: "강의계획서와 1주차 자료 공개"
  question: "How should we store and search records, process recent events, or follow dependencies? Solve a small problem first, then connect the pattern to tasks such as duplicate detection, event processing, and job ordering."
  question_ko: "기록을 저장하고 찾거나, 최근 이벤트를 처리하고 작업의 의존관계를 따라가려면 어떤 방법이 필요할까요? 작은 문제를 직접 푼 뒤 중복 확인, 이벤트 처리, 작업 순서 결정 같은 업무에 연결합니다."
  prerequisites: "Basic Python variables, conditionals, loops, and functions. Review these before Week 1 if they are unfamiliar. Prior algorithms study and advanced mathematics are not required."
  prerequisites_ko: "Python 변수·조건문·반복문·함수를 알고 시작합니다. 익숙하지 않다면 1주차 전에 복습합니다. 알고리즘 수강 경험이나 고급 수학은 요구하지 않습니다."
  learning_method: "Solve LeetCode problems aligned with each week's concepts. State the input and output, write a solution, trace a small example, and test edge cases. Explain why the chosen structure fits the task."
  learning_method_ko: "매주 배운 개념에 맞는 LeetCode 문제를 풉니다. 입력과 출력을 정리하고 풀이를 직접 작성한 뒤 작은 예제의 실행 과정과 경계 조건을 확인합니다. 선택한 자료구조가 문제에 맞는 이유도 설명합니다."
  companion_id: "practical-sql"
  materials_ready: true
  bundle_url: "/assets/courses/practical-algorithms/week-01-materials.zip"
  release_summary: "Week 1 includes two sessions, lecture pages, worked solutions, independent exercises, and runnable Python files. Weeks 2–8 are planned."
  release_summary_ko: "1주차의 두 차시 강의, 풀이 읽기자료, 독립 실습과 실행 가능한 Python 파일을 제공합니다. 2–8주차는 강의 계획입니다."
  weeks:
    - number: 1
      title: "Hashing and two pointers"
      title_ko: "해시와 두 포인터"
      topics: "Two Sum; Contains Duplicate II; Two Sum II - Input Array Is Sorted; 3Sum"
      topics_ko: "해시와 두 포인터의 상태 정의·추적·정당성·구현."
      url: "/courses/practical-algorithms/week-01/"
      deliverable: "Python solutions, state traces, reasoning, cost analysis, and boundary checks."
      deliverable_ko: "Python 풀이·상태 추적·정당성·비용 분석·경계 검사."
      reading_url: "/courses/practical-algorithms/week-01-reading/"
      practice_url: "/courses/practical-algorithms/week-01-practice/"
      pdf_en: "/assets/courses/practical-algorithms/week-01-en.pdf"
      pdf_ko: "/assets/courses/practical-algorithms/week-01-ko.pdf"
    - number: 2
      title: "Sliding windows and stacks"
      title_ko: "슬라이딩 윈도우와 스택"
      topics: "Longest Substring Without Repeating Characters; Minimum Size Subarray Sum; Min Stack; Evaluate Reverse Polish Notation"
      topics_ko: "슬라이딩 윈도우와 스택의 상태 정의·추적·정당성·구현."
      deliverable: "Python solutions, state traces, reasoning, cost analysis, and boundary checks."
      deliverable_ko: "Python 풀이·상태 추적·정당성·비용 분석·경계 검사."
    - number: 3
      title: "Binary search and linked lists"
      title_ko: "이진 탐색과 연결 리스트"
      topics: "Search a 2D Matrix; Search in Rotated Sorted Array; Reverse Linked List; Merge Two Sorted Lists"
      topics_ko: "이진 탐색과 연결 리스트의 상태 정의·추적·정당성·구현."
      deliverable: "Python solutions, state traces, reasoning, cost analysis, and boundary checks."
      deliverable_ko: "Python 풀이·상태 추적·정당성·비용 분석·경계 검사."
    - number: 4
      title: "Tree recursion, BFS, and BSTs"
      title_ko: "트리 재귀·BFS·BST"
      topics: "Maximum Depth of Binary Tree; Binary Tree Level Order Traversal; Validate Binary Search Tree; Kth Smallest Element in a BST"
      topics_ko: "트리 재귀·BFS·BST의 상태 정의·추적·정당성·구현."
      deliverable: "Python solutions, state traces, reasoning, cost analysis, and boundary checks."
      deliverable_ko: "Python 풀이·상태 추적·정당성·비용 분석·경계 검사."
    - number: 5
      title: "Heaps, intervals, and graph traversal"
      title_ko: "힙·구간·그래프 탐색"
      topics: "Kth Largest Element in an Array; Merge Intervals; Number of Islands; Rotting Oranges"
      topics_ko: "힙·구간·그래프 탐색의 상태 정의·추적·정당성·구현."
      deliverable: "Python solutions, state traces, reasoning, cost analysis, and boundary checks."
      deliverable_ko: "Python 풀이·상태 추적·정당성·비용 분석·경계 검사."
    - number: 6
      title: "Dependencies and backtracking"
      title_ko: "의존관계와 백트래킹"
      topics: "Course Schedule; Course Schedule II; Subsets; Combination Sum"
      topics_ko: "의존관계와 백트래킹의 상태 정의·추적·정당성·구현."
      deliverable: "Python solutions, state traces, reasoning, cost analysis, and boundary checks."
      deliverable_ko: "Python 풀이·상태 추적·정당성·비용 분석·경계 검사."
    - number: 7
      title: "One- and two-dimensional DP"
      title_ko: "1차원·2차원 동적 계획법"
      topics: "House Robber; Coin Change; Unique Paths; Longest Common Subsequence"
      topics_ko: "1차원·2차원 동적 계획법의 상태 정의·추적·정당성·구현."
      deliverable: "Python solutions, state traces, reasoning, cost analysis, and boundary checks."
      deliverable_ko: "Python 풀이·상태 추적·정당성·비용 분석·경계 검사."
    - number: 8
      title: "Greedy reasoning and mixed assessment"
      title_ko: "그리디와 혼합 평가"
      topics: "Jump Game; Jump Game II; Gas Station; Number of Islands"
      topics_ko: "그리디와 혼합 평가의 상태 정의·추적·정당성·구현."
      deliverable: "Python solutions, state traces, reasoning, cost analysis, and boundary checks."
      deliverable_ko: "Python 풀이·상태 추적·정당성·비용 분석·경계 검사."

- id: "practical-sql"
  title: "Practical SQL for Data Analysis and Applications"
  title_ko: "데이터 분석과 업무 활용을 위한 실무 SQL"
  subtitle: "Eight weeks of queries, relationships, and result checks"
  subtitle_ko: "조회·관계·결과 검증을 익히는 8주 과정"
  description: "Write SQL for everyday data questions, from filtering and aggregation to joins, CTEs, and window functions. Check the meaning of each row and verify results before using them."
  description_ko: "조회와 집계부터 JOIN·CTE·윈도 함수까지 업무 질문에 답하는 SQL을 직접 작성합니다. 각 행이 무엇을 뜻하는지 확인하고 결과를 검증하는 데 중점을 둡니다."
  url: "/courses/practical-sql/"
  syllabus_url: "/courses/practical-sql/syllabus/"
  level: "Introductory · no CS background required"
  level_ko: "입문 · 컴퓨터공학 비전공자 대상"
  duration: "8 weeks"
  duration_ko: "8주"
  availability: "Syllabus available · weekly materials planned"
  availability_ko: "강의계획서 제공 · 주차별 자료 준비 예정"
  question: "Why did a total change after joining two tables? Which equipment has no readings, and what counts as its latest record? Write queries whose output can be checked against the original question."
  question_ko: "두 테이블을 JOIN한 뒤 합계가 왜 달라졌을까요? 측정 기록이 없는 설비는 무엇이며, 최신 기록은 어떤 기준으로 정할까요? 질문의 뜻과 조회 결과가 일치하는 SQL을 작성합니다."
  prerequisites: "Familiarity with spreadsheet rows and columns. Prior programming, database, and algorithms courses are not required. Small Python examples are introduced when connecting queries to an application."
  prerequisites_ko: "스프레드시트의 행과 열을 이해하면 시작할 수 있습니다. 프로그래밍·데이터베이스·알고리즘 수강 경험은 요구하지 않습니다. 쿼리를 프로그램에 연결할 때 짧은 Python 예제를 설명합니다."
  learning_method: "Work through example problems and solutions in the course materials. Define the expected output, write SQL, inspect intermediate results, and compare with hand-checked rows and totals."
  learning_method_ko: "강의자료의 예제 문제와 풀이를 따라 공부합니다. 기대하는 결과를 먼저 정하고 SQL을 직접 작성한 뒤 중간 결과와 손으로 확인한 행·합계를 대조합니다."
  companion_id: "practical-algorithms"
  weeks:
    - number: 1
      title: "Tables, grain, and basic queries"
      title_ko: "테이블·행의 단위·기본 조회"
      topics: "Schema, keys, SELECT, WHERE, ORDER BY, DISTINCT, LIMIT, and NULL."
      topics_ko: "스키마·키, SELECT·WHERE·ORDER BY·DISTINCT·LIMIT·NULL."
      deliverable: "A basic query set with an explicit meaning for each output row."
      deliverable_ko: "결과의 한 행이 뜻하는 대상을 명시한 기본 조회 풀이."
      check: "Check missing values, filter boundaries, and a deterministic order when limiting rows."
      check_ko: "누락 값, 조건의 경계, LIMIT 사용 시 결과 순서를 결정할 기준 확인."
    - number: 2
      title: "Aggregation and conditional summaries"
      title_ko: "집계와 조건별 요약"
      topics: "GROUP BY, aggregates, HAVING, CASE WHEN, and the denominator of an average."
      topics_ko: "GROUP BY·집계 함수·HAVING·CASE WHEN, 평균의 분모."
      deliverable: "A grouped report and manually checked counts, totals, and averages."
      deliverable_ko: "그룹별 보고서와 직접 확인한 건수·합계·평균."
      check: "Distinguish COUNT(*) from COUNT(column), and WHERE from HAVING."
      check_ko: "COUNT(*)와 COUNT(column), WHERE와 HAVING 구분."
    - number: 3
      title: "Joins and matching grains"
      title_ko: "JOIN과 집계 단위 맞추기"
      topics: "Primary/foreign keys, 1:N relationships, INNER/LEFT JOIN, and aggregation before joining."
      topics_ko: "기본키·외래키, 1:N 관계, INNER·LEFT JOIN, JOIN 전 집계."
      deliverable: "A multi-table query with row-count and total checks before and after each join."
      deliverable_ko: "각 JOIN 전후의 행 수와 합계를 확인한 다중 테이블 풀이."
      check: "Find duplicated totals and lost unmatched rows; explain ON versus WHERE conditions in a LEFT JOIN."
      check_ko: "합계 중복과 미매칭 행 누락 확인. LEFT JOIN의 ON 조건과 WHERE 조건 차이 설명."
    - number: 4
      title: "Subqueries, CTEs, and existence checks"
      title_ko: "서브쿼리·CTE·존재 여부 확인"
      topics: "Subqueries, WITH, EXISTS/NOT EXISTS, staged aggregation, and composite conditions."
      topics_ko: "서브쿼리·WITH·EXISTS·NOT EXISTS, 단계별 집계와 복합 조건."
      deliverable: "A multi-stage query with the grain, key, and expected rows written for every CTE."
      deliverable_ko: "각 CTE의 행 단위·키·기대 행을 기록한 복합 쿼리."
      check: "Run intermediate steps; check multiple matches and the effect of NULL on NOT IN."
      check_ko: "중간 단계 실행, 여러 건이 매칭되는 경우와 NOT IN의 NULL 영향 확인."
    - number: 5
      title: "Window functions and event order"
      title_ko: "윈도 함수와 이벤트 순서"
      topics: "ROW_NUMBER, RANK, LAG, SUM OVER, partitions, and explicit window frames."

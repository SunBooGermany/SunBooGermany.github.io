title: "Sunwoo Kim | Research Blog"
description: "Research notes on AI-enabled optimization, constrained reinforcement learning, process systems engineering, and better judgment."
url: "https://sunboogermany.github.io"
baseurl: ""
lang: "en"
timezone: "Asia/Seoul"
markdown: kramdown
permalink: /research-log/:year/:month/:day/:title/

collections:
  better_judgment:
    output: true
    permalink: /better-judgment/:path/
    sort_by: date

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      language: "en"
  - scope:
      path: ""
      type: better_judgment
    values:
      layout: judgment-post
      language: "en"

exclude:
  - scripts
  - README.md
